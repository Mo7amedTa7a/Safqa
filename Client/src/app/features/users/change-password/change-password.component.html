<div class="change-password-container">
  <div class="safqa-card">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h4 class="fw-bold mb-1">تغيير كلمة المرور</h4>
        <p class="text-muted small mb-0">احرص على استخدام كلمة مرور قوية وغير مستخدمة في مواقع أخرى.</p>
      </div>
      <a routerLink="/profile" class="btn-safqa-outline py-1 px-3">
        <i class="bi bi-arrow-right"></i>
        <span>رجوع</span>
      </a>
    </div>

    <div *ngIf="successMessage" class="alert alert-success d-flex align-items-center gap-2">
      <i class="bi bi-check-circle-fill flex-shrink-0"></i>
      <div>{{ successMessage }}</div>
    </div>

    <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="mb-3">
        <label class="form-label">كلمة المرور الحالية</label>
        <input type="password" class="form-control" formControlName="currentPassword" />
      </div>

      <div class="mb-3">
        <label class="form-label">كلمة المرور الجديدة</label>
        <input type="password" class="form-control" formControlName="newPassword" />
      </div>

      <div class="mb-4">
        <label class="form-label">تأكيد كلمة المرور الجديدة</label>
        <input type="password" class="form-control" formControlName="confirmNewPassword" />
      </div>

      <div class="d-flex justify-content-end gap-2">
        <a routerLink="/profile" class="btn-safqa-outline">إلغاء</a>
        <button type="submit" class="btn-safqa-primary">تحديث كلمة المرور</button>
      </div>
    </form>
  </div>
</div>
