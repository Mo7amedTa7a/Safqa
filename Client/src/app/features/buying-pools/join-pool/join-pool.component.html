<div class="container py-5" dir="rtl">

  <div class="card shadow-sm">
    <div class="card-body text-center">

      <h3 class="mb-3">الانضمام إلى التجمع</h3>

      <p class="text-muted">
        هل أنت متأكد أنك تريد الانضمام إلى هذا التجمع؟
      </p>

      <div class="mb-4 text-start" style="max-width: 300px; margin: 0 auto;">
        <label for="quantity" class="form-label">الكمية المطلوبة</label>
        <input type="number" id="quantity" class="form-control text-center" [(ngModel)]="quantity" min="1" placeholder="أدخل الكمية">
      </div>

      @if (successMessage) {
        <div class="alert alert-success">
          {{ successMessage }}
        </div>
      }

      @if (errorMessage) {
        <div class="alert alert-danger">
          {{ errorMessage }}
        </div>
      }

      <button
        class="btn btn-primary"
        (click)="joinPool()"
        [disabled]="loading">

        @if (loading) {
          جاري الانضمام...
        } @else {
          انضمام إلى التجمع
        }

      </button>

    </div>
  </div>

</div>
