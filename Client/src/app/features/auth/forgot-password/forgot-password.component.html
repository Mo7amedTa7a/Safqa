<div class="auth-card">
  <div class="auth-card-body">
    <div class="auth-intro text-center">
      <div class="icon-circle mb-3 mx-auto">
        <i class="bi bi-key-fill"></i>
      </div>
      <h2 class="auth-title">نسيت كلمة المرور؟</h2>
      <p class="auth-subtitle">
        أدخل عنوان بريدك الإلكتروني المسجل وسنرسل لك رابطاً لإعادة تعيين كلمة المرور بأمان.
      </p>
    </div>

    <!-- Success Message -->
    <div *ngIf="successMessage" class="alert alert-success d-flex align-items-center gap-2" role="alert">
      <i class="bi bi-check-circle-fill flex-shrink-0"></i>
      <div>{{ successMessage }}</div>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="alert alert-danger d-flex align-items-center gap-2" role="alert">
      <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
      <div>{{ errorMessage }}</div>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!successMessage" novalidate>
      <div class="mb-3">
        <label class="form-label" for="forgotEmail">البريد الإلكتروني</label>
        <input
          id="forgotEmail"
          type="email"
          class="form-control"
          placeholder="name@company.com"
          formControlName="email"
          [class.is-invalid]="form.get('email')?.touched && form.get('email')?.invalid"
        />
        <div *ngIf="form.get('email')?.touched && form.get('email')?.invalid" class="invalid-feedback d-block">
          يرجى إدخال بريد إلكتروني صحيح.
        </div>
      </div>

      <button
        type="submit"
        class="btn-safqa-primary w-100 py-2 mt-2"
        [disabled]="isLoading"
      >
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status"></span>
        <span>إرسال رابط الاستعادة</span>
      </button>
    </form>

    <div class="text-center mt-4">
      <a routerLink="/auth/login" class="back-link">
        <i class="bi bi-arrow-right"></i>
        <span>العودة لتسجيل الدخول</span>
      </a>
    </div>
  </div>
</div>
