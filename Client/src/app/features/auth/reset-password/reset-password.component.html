<div class="auth-card">
  <div class="auth-card-body">
    <div class="auth-intro text-center">
      <div class="icon-circle mb-3 mx-auto">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <h2 class="auth-title">تعيين كلمة مرور جديدة</h2>
      <p class="auth-subtitle">
        يرجى إدخال كلمة مرور جديدة وقوية لحسابك.
      </p>
    </div>

    <!-- Success Message -->
    <div *ngIf="successMessage" class="alert alert-success d-flex align-items-center gap-2" role="alert">
      <i class="bi bi-check-circle-fill flex-shrink-0"></i>
      <div>{{ successMessage }}</div>
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="alert alert-danger d-flex align-items-center gap-2" role="alert">
      <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
      <div>{{ errorMessage }}</div>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!successMessage" novalidate>
      <div class="mb-3">
        <label class="form-label" for="newPassword">كلمة المرور الجديدة</label>
        <input
          id="newPassword"
          type="password"
          class="form-control"
          placeholder="8 خانات على الأقل"
          formControlName="password"
          [class.is-invalid]="form.get('password')?.touched && form.get('password')?.invalid"
        />
        <div *ngIf="form.get('password')?.touched && form.get('password')?.invalid" class="invalid-feedback d-block">
          يرجى إدخال كلمة مرور لا تقل عن 8 خانات.
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="confirmNewPassword">تأكيد كلمة المرور</label>
        <input
          id="confirmNewPassword"
          type="password"
          class="form-control"
          placeholder="أعد كتابة كلمة المرور"
          formControlName="confirmPassword"
          [class.is-invalid]="(form.get('confirmPassword')?.touched || form.touched) && form.errors?.['passwordMismatch']"
        />
        <div *ngIf="(form.get('confirmPassword')?.touched || form.touched) && form.errors?.['passwordMismatch']" class="invalid-feedback d-block">
          كلمات المرور غير متطابقة.
        </div>
      </div>

      <button
        type="submit"
        class="btn-safqa-primary w-100 py-2 mt-2"
        [disabled]="isLoading"
      >
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status"></span>
        <span>حفظ كلمة المرور الجديدة</span>
      </button>
    </form>
  </div>
</div>
