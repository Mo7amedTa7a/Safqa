<div dir="rtl">
  <div *ngIf="isLoading" class="text-center py-4">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">جاري التحميل...</span>
    </div>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <div *ngIf="!isLoading && reviews.length > 0">
    <div class="d-flex align-items-center mb-3">
      <h5 class="mb-0 me-3">التقييمات ({{ reviews.length }})</h5>
      <span class="text-warning fs-5">
        <span *ngFor="let s of getStars(averageRating)" [style.color]="s ? '#ffc107' : '#e0e0e0'">&#9733;</span>
      </span>
      <span class="text-muted ms-2">{{ averageRating }} / 5</span>
    </div>

    <div class="list-group">
      <div class="list-group-item" *ngFor="let review of reviews">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <div>
            <strong>{{ review.reviewer?.name || 'مستخدم' }}</strong>
            <span class="text-muted ms-2 small">{{ review.createdAt | date:'shortDate' }}</span>
          </div>
          <div class="text-warning">
            <span *ngFor="let s of getStars(review.rating)" [style.color]="s ? '#ffc107' : '#e0e0e0'">&#9733;</span>
          </div>
        </div>
        <p class="mb-0 text-muted" *ngIf="review.comment">{{ review.comment }}</p>
        <p class="mb-0 text-muted fst-italic" *ngIf="!review.comment">بدون تعليق</p>
      </div>
    </div>
  </div>

  <div *ngIf="!isLoading && reviews.length === 0" class="text-center text-muted py-4">
    لا توجد تقييمات حتى الآن
  </div>
</div>
